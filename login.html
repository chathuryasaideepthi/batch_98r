<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <h1><i>Login</i></h1>
    <form action="./sucess.html">
        <label>Email: &nbsp; &nbsp; &nbsp; </label>
        <input type="text" title="enter valid email id" pattern="[a-z]+[0-9]+@(gmail|yahoo)\.(com|in|co|gov|org|at)" required><br><br>
        <label>Password:</label>
        <input type="text" required pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[!@#$%^&*]).{8,16}"><br><br>
        <input type="button" value=forget_password onclick="window.location.href='./forget.html'">&nbsp;
        <input type="submit" value="Login">&nbsp;&nbsp;
        <p> have to create account: <input type="button" value=Signup onclick="window.location.href='./signup.html'"> </p>
        </form>
</body>
</html>
